name: agent-bridge
run-name: "${{ github.event.client_payload.cmd || inputs.cmd }}"

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "Команда PowerShell"
        required: true
        type: string
  repository_dispatch:
    types: [agent]

permissions: {}

concurrency:
  group: agent-bridge
  cancel-in-progress: false

jobs:
  exec:
    # repository_dispatch может отправить только тот, у кого есть write-доступ;
    # ручной запуск — только владелец репозитория.
    if: github.event_name == 'repository_dispatch' || github.actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Run
        shell: powershell
        env:
          CMD: ${{ github.event.client_payload.cmd || inputs.cmd }}
        run: |
          Write-Output ">>> $env:CMD"
          Write-Output "host: $env:COMPUTERNAME | user: $env:USERNAME | cwd: $(Get-Location)"
          Invoke-Expression $env:CMD *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\out.txt"

      - name: Save output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: ${{ runner.temp }}/out.txt
          if-no-files-found: ignore
          retention-days: 3
